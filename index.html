<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UNO Online เล่นกับเพื่อน</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col font-sans">

    <!-- Toast Notifications -->
    <div id="toast-container"></div>

    <!-- Custom Modal -->
    <div id="custom-modal" class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50 hidden backdrop-blur-sm transition-opacity">
        <div class="glass-panel p-6 max-w-sm w-full mx-4 text-center transform scale-95 transition-transform" id="custom-modal-content">
            <h3 id="modal-title" class="text-xl font-bold mb-4 text-white"></h3>
            <p id="modal-msg" class="mb-6 text-gray-300"></p>
            <div id="modal-actions" class="flex justify-center gap-3">
                <button id="modal-btn-ok" class="px-6 py-2 bg-blue-600 hover:bg-blue-700 rounded text-white font-semibold transition">ตกลง</button>
            </div>
        </div>
    </div>

    <!-- Color Picker Modal for Wild Cards -->
    <div id="color-picker-modal" class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50 hidden backdrop-blur-sm">
        <div class="glass-panel p-6 max-w-sm w-full mx-4 text-center">
            <h3 class="text-xl font-bold mb-6 text-white">เลือกสีที่ต้องการเล่น</h3>
            <div class="grid grid-cols-2 gap-4">
                <button onclick="submitColorChoice('red')" class="h-24 bg-red-500 hover:bg-red-400 rounded-lg shadow-lg transform hover:scale-105 transition"></button>
                <button onclick="submitColorChoice('blue')" class="h-24 bg-blue-500 hover:bg-blue-400 rounded-lg shadow-lg transform hover:scale-105 transition"></button>
                <button onclick="submitColorChoice('green')" class="h-24 bg-green-500 hover:bg-green-400 rounded-lg shadow-lg transform hover:scale-105 transition"></button>
                <button onclick="submitColorChoice('yellow')" class="h-24 bg-yellow-400 hover:bg-yellow-300 rounded-lg shadow-lg transform hover:scale-105 transition"></button>
            </div>
        </div>
    </div>

    <!-- Screen: Lobby -->
    <div id="screen-lobby" class="flex-1 flex items-center justify-center p-4">
        <div class="glass-panel p-8 w-full max-w-md shadow-2xl">
            <div class="text-center mb-8">
                <h1 class="text-5xl font-black mb-2 tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-red-500 via-yellow-400 to-green-500">
                    UNO เกมการ์ด
                </h1>
                <p class="text-gray-400">เล่นกับเพื่อน (2-6 คน)</p>
            </div>

            <div class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1">ชื่อของคุณ</label>
                    <input type="text" id="player-name" placeholder="ใส่ชื่อผู้เล่น..." class="w-full bg-gray-800 border border-gray-600 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition" maxlength="15">
                </div>

                <div class="pt-4 border-t border-gray-700">
                    <button id="btn-create-room" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold py-3 px-4 rounded-lg shadow-lg transform hover:-translate-y-1 transition flex items-center justify-center gap-2 mb-4">
                        <i class="fas fa-plus-circle"></i> สร้างห้องใหม่
                    </button>
                </div>

                <div class="relative flex items-center py-2">
                    <div class="flex-grow border-t border-gray-600"></div>
                    <span class="flex-shrink-0 mx-4 text-gray-500 text-sm">หรือ</span>
                    <div class="flex-grow border-t border-gray-600"></div>
                </div>

                <div class="flex gap-2">
                    <input type="text" id="join-room-code" placeholder="รหัสห้อง 6 หลัก" class="flex-1 bg-gray-800 border border-gray-600 rounded-lg px-4 py-3 text-white text-center font-mono uppercase focus:outline-none focus:border-green-500 transition" maxlength="6">
                    <button id="btn-join-room" class="bg-green-600 hover:bg-green-500 text-white font-bold py-3 px-6 rounded-lg shadow-lg transition">
                        เข้าร่วม
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Screen: Waiting Room -->
    <div id="screen-waiting" class="hidden flex-1 flex flex-col items-center justify-center p-4">
        <div class="glass-panel p-8 w-full max-w-2xl shadow-2xl relative">
            <button onclick="leaveRoom()" class="absolute top-4 left-4 text-gray-400 hover:text-white transition">
                <i class="fas fa-arrow-left mr-1"></i> ออกจากห้อง
            </button>

            <div class="text-center mt-6 mb-8">
                <h2 class="text-2xl text-gray-300">รหัสห้อง (Room Code)</h2>
                <div class="mt-2 flex items-center justify-center gap-3">
                    <span id="display-room-code" class="text-5xl font-mono font-black text-white tracking-widest bg-gray-800 px-6 py-2 rounded-lg border border-gray-600"></span>
                    <button onclick="copyRoomCode()" class="bg-gray-700 hover:bg-gray-600 p-3 rounded-lg text-white transition" title="คัดลอกรหัส">
                        <i class="fas fa-copy text-xl"></i>
                    </button>
                </div>
                <p class="text-sm text-gray-400 mt-2">ส่งรหัสนี้ให้เพื่อนเพื่อเข้าร่วมห้อง</p>
            </div>

            <div class="bg-gray-800/50 rounded-xl p-4 mb-6 border border-gray-700">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-semibold text-white">ผู้เล่น (<span id="player-count">1</span>/6)</h3>
                    <button id="btn-add-bot" class="hidden text-sm bg-purple-600 hover:bg-purple-500 text-white px-3 py-1 rounded transition">
                        <i class="fas fa-robot mr-1"></i> เพิ่มบอท
                    </button>
                </div>
                
                <div id="players-list" class="grid grid-cols-2 md:grid-cols-3 gap-4">
                    <!-- Player items will be injected here -->
                </div>
            </div>

            <div class="text-center">
                <p id="waiting-msg" class="text-yellow-400 mb-4 font-medium hidden">รอให้หัวหน้าห้องเริ่มเกม...</p>
                <button id="btn-start-game" class="hidden w-full md:w-auto px-10 py-3 bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-400 hover:to-emerald-500 text-white font-bold rounded-lg shadow-lg text-lg transform hover:-translate-y-1 transition disabled:opacity-50 disabled:cursor-not-allowed">
                    เริ่มเกมเลย!
                </button>
            </div>
        </div>
    </div>

    <!-- Screen: Game -->
    <div id="screen-game" class="hidden flex-1 flex flex-col relative h-screen">
        
        <!-- Header Info -->
        <div class="absolute top-0 left-0 w-full p-2 flex justify-between items-start z-10 pointer-events-none">
            <div class="glass-panel p-2 px-4 rounded-full pointer-events-auto flex items-center gap-2">
                <span class="text-xs text-gray-400">ห้อง:</span>
                <span id="game-room-code" class="font-mono font-bold"></span>
            </div>
            <button onclick="confirmLeaveGame()" class="glass-panel p-2 px-4 rounded-full text-red-400 hover:text-red-300 pointer-events-auto transition">
                <i class="fas fa-sign-out-alt"></i> ออก
            </button>
        </div>

        <!-- Opponents Area (Top / Sides) -->
        <div id="opponents-container" class="flex-1 flex justify-around items-start pt-16 px-4 pb-4">
            <!-- Opponents injected here dynamically -->
        </div>

        <!-- Play Area (Center) -->
        <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
            <div class="glass-panel p-6 rounded-2xl pointer-events-auto flex gap-6 items-center shadow-2xl" id="play-area-bg">
                
                <!-- Deck -->
                <div class="flex flex-col items-center">
                    <div id="deck-pile" class="uno-card card-back hover:scale-105 transition shadow-[4px_4px_0_#111,8px_8px_0_#222] mb-2" onclick="drawCard()">
                        <div class="inner-oval"></div>
                    </div>
                    <span class="text-xs text-gray-400 font-bold bg-gray-800 px-2 py-1 rounded-full"><span id="deck-count">112</span> ใบ</span>
                </div>

                <!-- Discard Pile -->
                <div class="flex flex-col items-center">
                    <div id="discard-pile" class="relative">
                        <!-- Render top card here -->
                    </div>
                    <div id="current-color-indicator" class="mt-4 px-3 py-1 rounded-full text-xs font-bold border hidden shadow-lg uppercase">
                        สีปัจจุบัน
                    </div>
                </div>

                <!-- Direction & Draw Stack Info -->
                <div class="absolute top-0 right-0 transform translate-x-1/2 -translate-y-1/2 flex flex-col gap-2">
                     <div id="direction-indicator" class="w-10 h-10 rounded-full glass-panel flex items-center justify-center text-xl text-white shadow-lg">
                        <i class="fas fa-redo"></i>
                    </div>
                    <div id="draw-stack-indicator" class="hidden w-10 h-10 rounded-full bg-red-600 text-white font-bold flex items-center justify-center shadow-lg border-2 border-white animate-bounce">
                        +0
                    </div>
                </div>

            </div>
        </div>

        <!-- Action Buttons (UNO) -->
        <div class="absolute bottom-[160px] right-4 md:right-10 z-20">
            <button id="btn-uno" onclick="callUno()" class="w-16 h-16 md:w-20 md:h-20 bg-gradient-to-br from-red-600 to-red-800 border-4 border-yellow-400 rounded-full font-black text-xl md:text-2xl text-yellow-400 shadow-[0_0_15px_rgba(255,0,0,0.5)] transform hover:scale-110 transition flex items-center justify-center opacity-50 cursor-not-allowed">
                UNO!
            </button>
        </div>

        <!-- My Hand Area -->
        <div class="h-40 md:h-48 w-full bg-black/40 backdrop-blur-sm border-t border-gray-700 pb-4 pt-2 relative z-10 flex flex-col">
            <div class="text-center text-sm font-semibold mb-1" id="my-turn-indicator">
                <span class="px-4 py-1 rounded-full bg-gray-700 text-gray-300">รอรอบของคุณ...</span>
            </div>
            <div id="my-hand" class="hand-container flex-1 items-end">
                <!-- Cards injected here -->
            </div>
        </div>

        <!-- Game Log -->
        <div class="absolute left-4 bottom-[160px] md:bottom-[200px] w-48 md:w-64 max-h-40 overflow-y-auto glass-panel p-3 text-xs md:text-sm hidden sm:block z-20" id="game-log">
            <div class="text-gray-400 font-bold border-b border-gray-600 mb-2 pb-1">บันทึกเกม</div>
            <ul id="log-list" class="space-y-1"></ul>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
